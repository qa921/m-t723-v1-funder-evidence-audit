name: validate
on:
  push:
    branches: [audit/m-t723-v1-approved]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: regenerate and show drift
        run: |
          python src/generate_rules.py
          git -c core.pager=cat diff --no-color
      - name: generator drift check
        run: git diff --exit-code --quiet
      - name: test suite
        if: always()
        run: python -m unittest discover -s tests -v
